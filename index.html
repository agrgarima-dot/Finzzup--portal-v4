<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
  <title>Finzzup — Client Portal</title>

  <!-- PWA -->
  <link rel="manifest" href="/manifest.json"/>
  <meta name="theme-color" content="#3B6FF7"/>
  <meta name="mobile-web-app-capable" content="yes"/>
  <meta name="apple-mobile-web-app-capable" content="yes"/>
  <meta name="apple-mobile-web-app-status-bar-style" content="default"/>
  <meta name="apple-mobile-web-app-title" content="Finzzup"/>
  <link rel="apple-touch-icon" href="/logo.png"/>
  <meta name="description" content="Finzzup — Your CFO on demand. Secure client portal."/>
  <meta name="robots" content="noindex, nofollow"/>

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet"/>

  <!-- Tabler icons -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.29.0/dist/tabler-icons.min.css"/>

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body, #root { height: 100%; }
    body { background: #F8FAFC; font-family: Inter, system-ui, sans-serif; -webkit-text-size-adjust: 100%; }
    #root:empty::before {
      content: '';
      display: block;
      width: 36px; height: 36px;
      border: 3px solid #E5E7EB;
      border-top-color: #3B6FF7;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      position: fixed; top: 50%; left: 50%;
      transform: translate(-50%,-50%);
    }
    @keyframes spin { to { transform: translate(-50%,-50%) rotate(360deg); } }
  </style>
</head>
<body>
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('/sw.js').catch(() => {});
      });
    }

    // Global error logger — sends unhandled errors to Supabase via /api/log-error
    function sendError(message, stack) {
      try {
        fetch('/api/log-error', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            message,
            stack,
            url: window.location.href,
            userAgent: navigator.userAgent,
            clientId: window.__finzzup_client_id__ || null,
          }),
        }).catch(() => {});
      } catch {}
    }
    window.addEventListener('error', e => {
      sendError(e.message, e.error?.stack || '');
    });
    window.addEventListener('unhandledrejection', e => {
      const msg = e.reason?.message || String(e.reason || 'Unhandled promise rejection');
      sendError(msg, e.reason?.stack || '');
    });
  </script>
</body>
</html>
